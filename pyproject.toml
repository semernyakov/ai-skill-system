[project]
name = "ai-skill-system"
version = "0.1.0"
description = "AI Skill System - Unified Management Interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=23.2.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "textual>=0.47.0",
    "httpx[socks]>=0.25.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "alembic>=1.18.4",
    "aiosqlite>=0.22.1",
    "sqlmodel>=0.0.38",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "slowapi>=0.1.9",
    "bleach>=6.3.0",
    "fastapi-limiter>=0.2.0",
    "pyrate-limiter>=2.10.0",
    "redis>=5.0.0",
    "aioredis>=2.0.0",
    "setuptools>=70.0.0",
]

[project.scripts]
ai-skill-system = "server.cli.main:cli"
ai-skill-system-tui = "server.tui.main:main"
ai-skill-system-clear-cache = "server.cli.main:clear_cache"
ai-skill-system-clear-python-cache = "server.cli.main:clear_python_cache"
ai-skill-system-clear-redis-cache = "server.cli.main:clear_redis_cache"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.bandit]
exclude_dirs = ["tests", "node_modules"]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
